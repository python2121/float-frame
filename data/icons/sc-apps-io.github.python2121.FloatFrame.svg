<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb9ee"/>
      <stop offset="1" stop-color="#1d7fd6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e646b"/>
      <stop offset="1" stop-color="#31363b"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="17" y="20" width="43" height="30" rx="6"/>
    </clipPath>
  </defs>

  <!-- the chromed window the video floated out of -->
  <rect x="4" y="12" width="40" height="30" rx="5" fill="url(#chrome)"/>
  <rect x="4" y="12" width="40" height="8" rx="5" fill="#232629"/>
  <rect x="4" y="17" width="40" height="3" fill="#232629"/>
  <circle cx="9" cy="16" r="1.6" fill="#da4453"/>
  <circle cx="14" cy="16" r="1.6" fill="#f67400"/>
  <circle cx="19" cy="16" r="1.6" fill="#27ae60"/>
  <rect x="4.5" y="12.5" width="39" height="29" rx="4.5" fill="none" stroke="#000000" stroke-opacity="0.35"/>

  <!-- soft shadow under the floating picture -->
  <rect x="17" y="22" width="43" height="30" rx="6" fill="#0b2a4a" opacity="0.35"/>

  <!-- the floating picture: no chrome, just the video -->
  <rect x="17" y="20" width="43" height="30" rx="6" fill="url(#screen)"/>
  <rect x="17" y="20" width="43" height="15" clip-path="url(#screenClip)" fill="url(#gloss)"/>
  <rect x="17.5" y="20.5" width="42" height="29" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>

  <!-- crop marks in the picture's corners -->
  <path d="M21.5 29v-4.5h4.5 M55.5 24.5v4.5 M51 24.5h4.5 M21.5 41v4.5h4.5 M55.5 45.5v-4.5 M51 45.5h4.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- play -->
  <path d="M34.5 29.5v11l9.5-5.5z" fill="#fcfcfc"/>
</svg>
